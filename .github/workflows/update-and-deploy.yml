name: Football Intelligence — atualizar e publicar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: football-lab-pages
  cancel-in-progress: true
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar histórico e previsões publicados
        run: python scripts/restore_published_state.py
      - name: Recuperar snapshots da branch persistente
        run: python scripts/data_store.py restore
      - name: Importar incrementalmente épocas dinamarquesas
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[full-backfill]')
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/backfill_history.py --max-calls 55 --pause 6
          else
            python scripts/backfill_history.py --max-calls 12 --pause 6
          fi
      - name: Scraper oficial DBU (respeita robots, com limites)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/scrape_dbu.py --max-pages 0
          else
            python scripts/scrape_dbu.py --max-pages 2 --pause 8
          fi
      - name: Reconciliar nomes de clubes e play-offs oficiais da Dinamarca
        run: python scripts/reconcile_danish_history.py
      - name: Avaliar fonte pública de estatísticas avançadas (amostra pequena)
        run: python scripts/assess_stats_sources.py --sample 2
      - name: Auditar 5 épocas por campeonato
        run: python scripts/audit_history.py --strict
      - name: Validar modelos com teste histórico independente
        run: python scripts/validate_models.py
      - name: Calibrar mercados v5 com época reservada para teste
        run: python scripts/build_value_engine.py
      - name: Medir impacto preditivo de fatores anteriores ao jogo
        run: python scripts/build_feature_impact.py
      - name: Recolher jogos das duas ligas
        run: python scripts/update_data.py
      - name: Recolher notícias e ausências documentadas
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/update_intelligence.py
      - name: Calcular modelos e backtesting v3
        run: python scripts/build_model.py
      - name: Guardar previsões antes dos jogos
        run: python scripts/record_predictions.py
      - name: Calcular fiabilidade com épocas históricas e ledger
        run: python scripts/build_reliability.py
      - name: Recolher Taça de Portugal, Taça da Liga e competições UEFA
        run: python scripts/collect_cross_competitions.py --max-calls 8 --pause 3.5
      - name: Verificar Taça da Dinamarca na DBU oficial (opcional)
        run: python scripts/collect_danish_cup.py
      - name: Verificar onzes observáveis antes dos jogos
        run: python scripts/collect_prematch_lineups.py --max-calls 2
      - name: Atualizar descanso e carga de jogos em todas as competições conhecidas
        run: python scripts/build_schedule_context.py
      - name: Persistir snapshots na branch football-data
        id: persistent_state
        continue-on-error: true
        run: python scripts/data_store.py save
      - name: Registar saúde do armazenamento
        env:
          STORAGE_OUTCOME: ${{ steps.persistent_state.outcome }}
        run: |
          python -c "import json,os,datetime,pathlib; ok=os.environ.get('STORAGE_OUTCOME')=='success'; v={'schema':1,'persistent_branch':'football-data','persisted':ok,'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'note':'Snapshot gravado na branch dedicada' if ok else 'AVISO: gravação na branch não confirmada; existe cópia temporária nas Actions/Pages'};pathlib.Path('data/storage_status.json').write_text(json.dumps(v,ensure_ascii=False)+'\n',encoding='utf-8')"
      - name: Verificar ficheiros estatísticos
        run: |
          test -s data/history.json
          test -s data/ledger.json
          test -s data/reliability.json
          test -s data/quality.json
          test -s data/validation.json
          test -s data/storage_status.json
          test -s data/scrape_report.json
          test -s data/stats_coverage.json
          test -s data/value_engine.json
          test -s data/feature_impact.json
          test -s data/cross_competitions.json
          test -s data/schedule_context.json
          test -s data/prematch_lineups.json
      - name: Arquivar estado para recuperação
        uses: actions/upload-artifact@v4
        with:
          name: football-reliability-state
          path: |
            data/history.json
            data/ledger.json
            data/reliability.json
            data/quality.json
            data/validation.json
            data/storage_status.json
            data/scrape_report.json
            data/stats_coverage.json
            data/value_engine.json
            data/feature_impact.json
            data/cross_competitions.json
            data/schedule_context.json
            data/prematch_lineups.json
          retention-days: 90
      - name: Testar motor e painel de fiabilidade
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validar sintaxe do dashboard
        run: node --check app/app.js
      - name: Preparar dashboard estático
        run: |
          mkdir -p public/data
          cp app/index.html app/style.css app/app.js public/
          cp data/season.json data/intelligence.json data/model.json data/reliability.json data/ledger.json data/history.json data/quality.json data/validation.json data/storage_status.json data/scrape_report.json data/stats_coverage.json data/value_engine.json data/feature_impact.json data/cross_competitions.json data/schedule_context.json data/prematch_lineups.json public/data/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
