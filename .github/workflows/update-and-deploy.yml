name: Football Intelligence — atualizar e publicar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: football-lab-pages
  cancel-in-progress: true
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar histórico e previsões publicados
        run: python scripts/restore_published_state.py
      - name: Recuperar snapshots da branch persistente
        run: python scripts/data_store.py restore
      - name: Importar incrementalmente épocas dinamarquesas
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[full-backfill]')
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/backfill_history.py --max-calls 55 --pause 6
          else
            python scripts/backfill_history.py --max-calls 12 --pause 6
          fi
      - name: Scraper oficial DBU (respeita robots, com limites)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/scrape_dbu.py --max-pages 0
          else
            python scripts/scrape_dbu.py --max-pages 2 --pause 8
          fi
      - name: Reconciliar nomes de clubes e play-offs oficiais da Dinamarca
        run: python scripts/reconcile_danish_history.py
      - name: Avaliar fonte pública de estatísticas avançadas (amostra pequena)
        run: python scripts/assess_stats_sources.py --sample 2
      - name: Recolher amostra diária de remates (respeita robots e limites)
        run: python scripts/collect_advanced_signals.py --max-per-league 3
      - name: Auditar 5 épocas por campeonato
        run: python scripts/audit_history.py --strict
      - name: Validar modelos com teste histórico independente
        run: python scripts/validate_models.py
      - name: Calibrar mercados v5 com época reservada para teste
        run: python scripts/build_value_engine.py
      - name: Medir impacto preditivo de fatores anteriores ao jogo
        run: python scripts/build_feature_impact.py
      - name: Recolher jogos das duas ligas
        run: python scripts/update_data.py
      - name: Calcular indicadores exploratórios de remates, sem alterar previsões
        run: python scripts/build_shots_research.py
      - name: Adicionar Eredivisie, 1. Division dinamarquesa e Eliteserien
        run: python scripts/collect_expanded_leagues.py --max-calls 6 --pause 2
      - name: Complementar resultados da Eliteserien 2026 (fonte pública de investigação)
        run: python scripts/collect_norwegian_fantasy.py
      - name: Tentar confirmar 1. Division 2026/27 na DBU oficial (robots e limites)
        run: python scripts/collect_danish_first_official.py
      - name: Completar Eredivisie com arquivo CC0 e reconciliar jogos
        run: python scripts/collect_openfootball_nl.py
      - name: Importar arquivo histórico CC0 da 1. Division e Eliteserien (sem mudar o modelo)
        run: python scripts/collect_expanded_historical_cc0.py
      - name: Recuperar resultados finais confirmados pelo ID original com quota gratuita
        run: python scripts/recover_verified_results.py --max-requests 6
      - name: Recolher notícias e ausências documentadas
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/update_intelligence.py
      - name: Calcular modelos e backtesting v3
        run: python scripts/build_model.py
      - name: Guardar previsões antes dos jogos
        run: python scripts/record_predictions.py
      - name: Guardar previsões 1X2 futuras dos cinco campeonatos
        run: python scripts/record_expansion_1x2.py
      - name: Recuperar proveniência dos IDs 1X2 da Eredivisie sem alterar previsões
        run: python scripts/reconcile_nl_forecast_ids.py
      - name: Registar experiência prospetiva Poisson + xG, sem alterar modelo
        run: python scripts/build_xg_experiment.py
      - name: Auditar integridade 1X2 de Portugal, Dinamarca, Países Baixos e Noruega
        run: python scripts/audit_expansion_1x2.py
      - name: Comparar previsões reais 1X2 das cinco ligas
        run: python scripts/build_league_comparison.py
      - name: Auditar saúde e pendências das previsões prospetivas
        run: python scripts/audit_ledger_health.py
      - name: Construir Centro de Validação 1X2 sem reescrever previsões
        run: python scripts/build_validation_center.py
      - name: Calcular fiabilidade com épocas históricas e ledger
        run: python scripts/build_reliability.py
      - name: Auditar separadamente a fiabilidade nas três novas ligas
        run: python scripts/build_expansion_reliability.py
      - name: Recolher Taça de Portugal, Taça da Liga e competições UEFA
        run: python scripts/collect_cross_competitions.py --max-calls 8 --pause 3.5
      - name: Auditar cobertura histórica UEFA, sem presumir completude
        run: python scripts/audit_european_coverage.py
      - name: Verificar Taça da Dinamarca na DBU oficial (opcional)
        run: python scripts/collect_danish_cup.py
      - name: Taça da Dinamarca, fonte secundária permitida (poupança de pedidos)
        run: python scripts/collect_danish_cup_fallback.py --max-seasons 2
      - name: Completar Taça da Dinamarca 2024/25 em arquivo público (robots)
        run: python scripts/collect_danish_cup_archive.py
      - name: Recuperar Taça de Portugal e Taça da Liga de 2024/25 a 2025/26
        run: python scripts/collect_portugal_cup_archive.py
      - name: Verificar onzes observáveis antes dos jogos
        run: python scripts/collect_prematch_lineups.py --max-calls 2
      - name: Atualizar descanso e carga de jogos em todas as competições conhecidas
        run: python scripts/build_schedule_context.py
      - name: Testar efeito de descanso e carga de taças/UEFA no histórico 1X2
        run: python scripts/build_multi_competition_impact.py
      - name: Auditar cobertura de resultados, temporadas e estatísticas das cinco ligas
        run: python scripts/build_data_coverage.py
      - name: Persistir snapshots na branch football-data
        id: persistent_state
        continue-on-error: true
        run: python scripts/data_store.py save
      - name: Registar saúde do armazenamento
        env:
          STORAGE_OUTCOME: ${{ steps.persistent_state.outcome }}
        run: |
          python -c "import json,os,datetime,pathlib; ok=os.environ.get('STORAGE_OUTCOME')=='success'; v={'schema':1,'persistent_branch':'football-data','persisted':ok,'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'note':'Snapshot gravado na branch dedicada' if ok else 'AVISO: gravação na branch não confirmada; existe cópia temporária nas Actions/Pages'};pathlib.Path('data/storage_status.json').write_text(json.dumps(v,ensure_ascii=False)+'\n',encoding='utf-8')"
      - name: Verificar ficheiros estatísticos
        run: |
          test -s data/history.json
          test -s data/ledger.json
          test -s data/reliability.json
          test -s data/quality.json
          test -s data/validation.json
          test -s data/storage_status.json
          test -s data/scrape_report.json
          test -s data/stats_coverage.json
          test -s data/advanced_signals.json
          test -s data/shots_research.json
          test -s data/xg_experiment.json
          test -s data/nl_history.json
          test -s data/expansion_reliability.json
          test -s data/expansion_1x2_ledger.json
          test -s data/expansion_1x2_audit.json
          test -s data/league_comparison.json
          test -s data/validation_center.json
          test -s data/data_coverage.json
          test -s data/expanded_history.json
          test -s data/xg_shadow_ledger.json
          test -s data/value_engine.json
          test -s data/feature_impact.json
          test -s data/cross_competitions.json
          test -s data/schedule_context.json
          test -s data/prematch_lineups.json
          test -s data/multi_competition_impact.json
          test -s data/ledger_health.json
          test -s data/european_coverage.json
      - name: Arquivar estado para recuperação
        uses: actions/upload-artifact@v4
        with:
          name: football-reliability-state
          path: |
            data/history.json
            data/ledger.json
            data/reliability.json
            data/quality.json
            data/validation.json
            data/storage_status.json
            data/scrape_report.json
            data/stats_coverage.json
            data/advanced_signals.json
            data/shots_research.json
            data/xg_experiment.json
            data/nl_history.json
            data/expansion_reliability.json
            data/expansion_1x2_ledger.json
            data/expansion_1x2_audit.json
            data/league_comparison.json
            data/validation_center.json
            data/data_coverage.json
            data/expanded_history.json
            data/xg_shadow_ledger.json
            data/value_engine.json
            data/feature_impact.json
            data/cross_competitions.json
            data/schedule_context.json
            data/prematch_lineups.json
            data/multi_competition_impact.json
            data/ledger_health.json
            data/european_coverage.json
          retention-days: 90
      - name: Testar motor e painel de fiabilidade
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Testar navegação simplificada e modelo JavaScript
        run: node --test tests/test_model.cjs tests/test_clean_ui.cjs tests/test_league_expansion.cjs tests/test_validation_ui.cjs tests/test_coverage_ui.cjs
      - name: Validar sintaxe do dashboard
        run: node --check app/app.js && node --check app/validation.js && node --check app/coverage.js
      - name: Preparar dashboard estático
        run: |
          mkdir -p public/data
          cp app/index.html app/style.css app/app.js app/validation.js app/coverage.js public/
          cp data/season.json data/intelligence.json data/model.json data/reliability.json data/ledger.json data/history.json data/quality.json data/validation.json data/storage_status.json data/scrape_report.json data/stats_coverage.json data/advanced_signals.json data/shots_research.json data/xg_experiment.json data/nl_history.json data/expansion_reliability.json data/expansion_1x2_audit.json data/league_comparison.json data/validation_center.json data/data_coverage.json data/expanded_history.json data/value_engine.json data/feature_impact.json data/cross_competitions.json data/schedule_context.json data/prematch_lineups.json data/multi_competition_impact.json data/ledger_health.json data/european_coverage.json public/data/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
