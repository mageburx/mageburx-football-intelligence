name: Football Intelligence — atualizar e publicar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: football-lab-pages
  cancel-in-progress: true
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar histórico e previsões publicados
        run: python scripts/restore_published_state.py
      - name: Importar incrementalmente épocas dinamarquesas
        if: github.event_name != 'push'
        run: python scripts/backfill_history.py --max-calls 18 --pause 3.5
      - name: Recolher jogos das duas ligas
        run: python scripts/update_data.py
      - name: Recolher notícias e ausências documentadas
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/update_intelligence.py
      - name: Calcular modelos e backtesting v3
        run: python scripts/build_model.py
      - name: Guardar previsões antes dos jogos
        run: python scripts/record_predictions.py
      - name: Calcular fiabilidade com épocas históricas e ledger
        run: python scripts/build_reliability.py
      - name: Testar motor e painel de fiabilidade
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verificar ficheiros estatísticos
        run: |
          test -s data/history.json
          test -s data/ledger.json
          test -s data/reliability.json
      - name: Arquivar estado para recuperação
        uses: actions/upload-artifact@v4
        with:
          name: football-reliability-state
          path: |
            data/history.json
            data/ledger.json
            data/reliability.json
          retention-days: 90
      - name: Validar sintaxe do dashboard
        run: node --check app/app.js
      - name: Preparar dashboard estático
        run: |
          mkdir -p public/data
          cp app/index.html app/style.css app/app.js public/
          cp data/season.json data/intelligence.json data/model.json data/reliability.json data/ledger.json data/history.json public/data/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
